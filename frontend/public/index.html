<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/PrimitiveIcon.ico" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#1aac83" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Primitive - A calm space for sharing thoughts, ideas, and connecting with others in a mindful environment"
    />
    <meta name="keywords" content="social, thoughts, sharing, community, mindful, calm, space" />
    <meta name="author" content="Primitive Team" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Primitive - A Calm Space for Sharing Thoughts" />
    <meta
      property="og:description"
      content="Join our peaceful platform for sharing thoughts and connecting with others"
    />
    <meta property="og:image" content="%PUBLIC_URL%/social-preview.png" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:site_name" content="Primitive" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@primitive_app" />
    <meta name="twitter:title" content="Primitive - A Calm Space for Sharing Thoughts" />
    <meta
      name="twitter:description"
      content="Join our peaceful platform for sharing thoughts and connecting with others"
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-preview.png" />

    <!-- PWA & App Links -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preload Critical Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

    <!-- Preload CSS -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Primitive",
        "description": "A calm space for sharing thoughts and connecting with others",
        "url": "https://yourdomain.com",
        "applicationCategory": "SocialNetworkApplication",
        "operatingSystem": "All",
        "permissions": "browser",
        "author": {
          "@type": "Organization",
          "name": "Primitive"
        }
      }
    </script>

    <title>Primitive - A Calm Space for Sharing Thoughts</title>

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Primitive" />
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash-apple.png" />

    <!-- Windows Meta Tags -->
    <meta name="msapplication-TileColor" content="#1aac83" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/mstile-144x144.png" />
    <meta name="msapplication-config" content="browserconfig.xml" />
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: 'Poppins', sans-serif">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run Primitive.</p>
        <p>
          Primitive is a modern web application that requires JavaScript to provide its full
          functionality.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
