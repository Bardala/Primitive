<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primitive - Redirecting...</title>
    <meta http-equiv="refresh" content="0; URL='https://primitive-space.vercel.app/'" />
    <script>
      // Immediate redirect
      window.location.href = 'https://primitive-space.vercel.app/';

      // Fallback for if JavaScript is disabled
      setTimeout(function () {
        window.location.href = 'https://primitive-space.vercel.app/';
      }, 100);
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
          'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #1aac83 0%, #126a52 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
      }

      .redirect-container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 3rem;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 500px;
      }

      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 1.5rem;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        color: #1aac83;
        margin: 0 auto 1.5rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        font-weight: 700;
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 2rem;
        opacity: 0.9;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .link {
        color: white;
        text-decoration: underline;
        margin-top: 1.5rem;
        display: inline-block;
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }

      .link:hover {
        opacity: 1;
      }

      @media (max-width: 600px) {
        .redirect-container {
          margin: 1rem;
          padding: 2rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="redirect-container">
      <div class="logo">P</div>
      <h1>Primitive</h1>
      <p>Redirecting you to our new platform...</p>
      <div class="spinner"></div>
      <p>
        If you are not redirected automatically,
        <a href="https://primitive-space.vercel.app/" class="link">click here</a>
      </p>
    </div>

    <!-- Google Analytics tracking for the redirect page (optional) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');

      // Track the redirect
      gtag('event', 'redirect', {
        event_category: 'navigation',
        event_label: 'to_vercel',
        value: 1,
      });
    </script>
  </body>
</html>
